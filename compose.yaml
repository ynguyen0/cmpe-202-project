services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: cmpe202
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cmpe202"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
